<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Naviquest benchmark comparison</title>
  <desc id="desc">Across 20 research tasks on 10 sites, Naviquest earned full credit on all 20 answers while direct fetch earned full credit on 19 and partial credit on one. Naviquest used 4.1 times fewer total tokens, 2.6 times fewer median tokens per task, and 24.6 times less peak context. Direct fetch was 2.3 times faster.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0c1321"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43d17d"/>
      <stop offset="1" stop-color="#82e6a6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1470" cy="72" r="180" fill="#43d17d" opacity=".035"/>
  <circle cx="80" cy="850" r="230" fill="#71b7ff" opacity=".035"/>

  <text x="80" y="72" fill="#7ee2a3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">NAVIQUEST | RESEARCH RACE</text>
  <text x="80" y="133" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="750">Full credit on 1 more answer. 4.1x fewer tokens.</text>
  <text x="80" y="177" fill="#97a3b8" font-family="Inter, Arial, sans-serif" font-size="22">20 identical tasks | 10 sites | real Chrome | AI off | blind LLM judge | POC-scale</text>

  <g filter="url(#shadow)">
    <rect x="80" y="225" width="690" height="240" rx="22" fill="#121a29" stroke="#43d17d" stroke-opacity=".65"/>
    <rect x="830" y="225" width="690" height="240" rx="22" fill="#121a29" stroke="#f07187" stroke-opacity=".65"/>
  </g>

  <circle cx="118" cy="267" r="7" fill="#64dc91"/>
  <text x="138" y="276" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Naviquest agent</text>
  <text x="118" y="310" fill="#7d899e" font-family="Inter, Arial, sans-serif" font-size="17">six WebMCP tools | browser-side retrieval</text>
  <text x="118" y="382" fill="#74dfa0" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="760">52,822</text>
  <text x="118" y="411" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2">TOTAL TOKENS</text>
  <text x="410" y="382" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">20 / 20</text>
  <text x="410" y="411" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.5">FULL CREDIT</text>
  <text x="640" y="382" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">1,551</text>
  <text x="640" y="411" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1">PEAK TOKENS</text>

  <circle cx="868" cy="267" r="7" fill="#f07187"/>
  <text x="888" y="276" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Direct-fetch agent</text>
  <text x="868" y="310" fill="#7d899e" font-family="Inter, Arial, sans-serif" font-size="17">readability text | per-session cache</text>
  <text x="868" y="382" fill="#f48195" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="760">214,481</text>
  <text x="868" y="411" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2">TOTAL TOKENS</text>
  <text x="1170" y="382" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">19.5 / 20</text>
  <text x="1170" y="411" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1">1 PARTIAL ANSWER</text>
  <text x="1460" y="382" text-anchor="end" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">38,198</text>
  <text x="1460" y="411" text-anchor="end" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1">PEAK TOKENS</text>

  <text x="80" y="520" fill="#cbd3df" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650">TOTAL TOKENS SENT TO THE AGENT</text>
  <rect x="80" y="542" width="1440" height="34" rx="17" fill="#1b2536"/>
  <rect x="80" y="542" width="355" height="34" rx="17" fill="url(#green)"/>
  <text x="98" y="566" fill="#07120c" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">NAVIQUEST 52,822</text>
  <text x="1502" y="566" text-anchor="end" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">DIRECT FETCH 214,481</text>

  <text x="80" y="626" fill="#cbd3df" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650">LARGEST SINGLE RESPONSE</text>
  <rect x="80" y="648" width="1440" height="34" rx="17" fill="#1b2536"/>
  <rect x="80" y="648" width="59" height="34" rx="17" fill="url(#green)"/>
  <text x="155" y="673" fill="#74dfa0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">1,551</text>
  <text x="1502" y="673" text-anchor="end" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">38,198</text>

  <g>
    <rect x="80" y="730" width="330" height="94" rx="18" fill="#121a29" stroke="#253248"/>
    <rect x="440" y="730" width="330" height="94" rx="18" fill="#121a29" stroke="#253248"/>
    <rect x="800" y="730" width="330" height="94" rx="18" fill="#121a29" stroke="#253248"/>
    <rect x="1160" y="730" width="360" height="94" rx="18" fill="#121a29" stroke="#5b4b1d"/>
    <text x="105" y="775" fill="#74dfa0" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="780">2.6x fewer</text>
    <text x="105" y="803" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">MEDIAN TOKENS / TASK</text>
    <text x="465" y="775" fill="#74dfa0" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="780">4.1x fewer</text>
    <text x="465" y="803" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">TOTAL TOKENS</text>
    <text x="825" y="775" fill="#74dfa0" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="780">24.6x smaller</text>
    <text x="825" y="803" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">PEAK CONTEXT</text>
    <text x="1185" y="775" fill="#f3c64d" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="780">2.3x faster</text>
    <text x="1185" y="803" fill="#8490a4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">DIRECT-FETCH BASELINE</text>
  </g>

  <text x="80" y="866" fill="#738096" font-family="Inter, Arial, sans-serif" font-size="16">One answer scored better in this run; the half-point margin is within noise. Context efficiency - not speed - is the demonstrated advantage.</text>
</svg>
